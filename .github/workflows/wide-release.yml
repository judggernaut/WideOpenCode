name: wide-release

# Builds WideOpenCode CLI binaries and unsigned desktop installers and attaches
# them to a GitHub release. The desktop auto-updater points at this repo's
# releases (configured in packages/desktop/electron-builder.config.ts).
#
# Desktop artifacts are unsigned: macOS builds are ad-hoc signed (users must run
# `xattr -cr /Applications/WideOpenCode.app` after install) and Windows builds
# are unsigned (SmartScreen will warn).

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [wide-sync]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to main's package.json)"
        required: false
      tag:
        description: "Release tag (defaults to v<version>-wide)"
        required: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wide-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Test release detection
        working-directory: script/wide
        run: bun test release.test.ts

      - name: Detect an unpublished version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIDE_VERSION: ${{ inputs.version }}
          WIDE_TAG: ${{ inputs.tag }}
        run: |
          bun run script/wide/release.ts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cli:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify WideOpenCode overlay (fail closed)
        run: bun run script/wide/verify.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI (all targets)
        run: bun run ./packages/cli/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}

      - name: Collect release assets
        run: |
          mkdir -p release
          cp packages/cli/dist/cli-darwin-arm64/bin/wideopencode          release/wideopencode-darwin-arm64
          cp packages/cli/dist/cli-darwin-x64/bin/wideopencode            release/wideopencode-darwin-x64
          cp packages/cli/dist/cli-linux-arm64/bin/wideopencode           release/wideopencode-linux-arm64
          cp packages/cli/dist/cli-linux-x64/bin/wideopencode             release/wideopencode-linux-x64
          cp packages/cli/dist/cli-windows-arm64/bin/wideopencode.exe     release/wideopencode-windows-arm64.exe
          cp packages/cli/dist/cli-windows-x64/bin/wideopencode.exe       release/wideopencode-windows-x64.exe
          chmod +x release/wideopencode-darwin-* release/wideopencode-linux-*

      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: |
            packages/cli/dist/cli-*/bin/wideopencode
            packages/cli/dist/cli-*/bin/wideopencode.exe
            packages/cli/dist/cli-*/package.json
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: release
          retention-days: 3

  desktop:
    needs: [plan, cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            install_flags: ""
          - host: macos-14
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            install_flags: --cpu=*
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform_flag: --win
            install_flags: ""
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
            install_flags: ""
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    env:
      # Real Developer ID signing + notarization when the Apple certificate secret exists.
      WIDE_SIGN_MAC: ${{ secrets.APPLE_CERTIFICATE && '1' || '' }}
      WIDE_NOTARIZE_MAC: ${{ secrets.APPLE_API_KEY_P8 && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/cli/dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Import Apple signing certificate
        if: ${{ runner.os == 'macOS' && env.WIDE_SIGN_MAC != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Write notarization API key
        if: ${{ runner.os == 'macOS' && env.WIDE_NOTARIZE_MAC != '' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Install dependencies
        run: bun install --frozen-lockfile ${{ matrix.install_flags }}

      - name: Install rpm (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts
        env:
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_TARGET: ${{ matrix.target }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Build renderer + main
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_TARGET: ${{ matrix.target }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Package
        working-directory: packages/desktop
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never --config electron-builder.config.ts
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_TARGET: ${{ matrix.target }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CERTIFICATE && 'true' || 'false' }}
          CSC_KEYCHAIN: ${{ secrets.APPLE_CERTIFICATE && 'build' || '' }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: packages/desktop/dist/*
          retention-days: 3

  release:
    needs: [plan, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          mkdir -p release
          cp artifacts/cli-release/* release/
          # Only the top level of each desktop artifact (installers, zips, latest*.yml).
          # -maxdepth 2 excludes unpacked app dirs and the cli-dist tree.
          find artifacts -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name 'latest*.yml' \) \
            -exec cp -n {} release/ \;
          ls -la release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.WIDE_SYNC_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          args=()
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "WideOpenCode $RELEASE_VERSION" \
            --notes "WideOpenCode $RELEASE_VERSION, built from $RELEASE_SHA with the WideOpenCode overlay." \
            "${args[@]}"

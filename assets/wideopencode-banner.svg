<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" fill="none" role="img" aria-label="WideOpenCode">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1524"/>
      <stop offset="1" stop-color="#152A49"/>
    </linearGradient>
    <linearGradient id="b-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CC4FF"/>
      <stop offset="0.55" stop-color="#2E8BFF"/>
      <stop offset="1" stop-color="#0B49D6"/>

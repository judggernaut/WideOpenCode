      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F1FF"/>
    </linearGradient>
    <linearGradient id="app-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB6FF"/>
